name: Admin verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify admin source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: 'off'
      CGO_ENABLED: '0'
    steps:
      - name: Checkout complete source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - name: Install locked frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Check frontend types
        working-directory: web
        run: bun run typecheck
      - name: Test member analysis and admin history
        working-directory: web
        run: bun run test src/features/member-usage/__tests__ src/features/admin-updates/__tests__
      - name: Build production frontend
        working-directory: web
        run: bun run build
      - name: Check admin changelog
        run: node scripts/generate-admin-changelog.mjs --check
      - name: Test request capture, archives and admin access
        run: go test ./service ./controller ./model ./pkg/adminversion
      - name: Build complete Linux backend
        run: go build -o /tmp/new-api main.go
